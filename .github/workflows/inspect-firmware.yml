
name: Inspect Infinix Firmware Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Download firmware release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p images

          gh release download firmware-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "boot.img" \
            --dir images

          gh release download firmware-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "vendor_boot.img" \
            --dir images

          echo "=== DOWNLOADED FILES ==="
          ls -lh images
          sha256sum images/*

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 binutils gzip file xz-utils lz4

      - name: Download Android boot image tools
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            boot-tools

      - name: Unpack firmware images
        run: |
          mkdir -p unpacked/boot unpacked/vendor_boot

          python3 boot-tools/unpack_bootimg.py \
            --boot_img images/boot.img \
            --out unpacked/boot

          python3 boot-tools/unpack_bootimg.py \
            --boot_img images/vendor_boot.img \
            --out unpacked/vendor_boot

          echo "=== BOOT FILES ==="
          ls -lh unpacked/boot

          echo "=== VENDOR BOOT FILES ==="
          ls -lh unpacked/vendor_boot

      - name: Inspect actual phone kernel
        run: |
          set -e

          KERNEL=unpacked/boot/kernel
          RAW=unpacked/boot/kernel.raw

          echo "=== ORIGINAL KERNEL ==="
          file "$KERNEL"

          if gzip -t "$KERNEL" 2>/dev/null; then
            echo "Kernel compression: gzip"
            gzip -dc "$KERNEL" > "$RAW"
          elif xz -t "$KERNEL" 2>/dev/null; then
            echo "Kernel compression: xz"
            xz -dc "$KERNEL" > "$RAW"
          elif lz4 -t "$KERNEL" 2>/dev/null; then
            echo "Kernel compression: lz4"
            lz4 -dc "$KERNEL" > "$RAW"
          else
            echo "Kernel is not directly recognized as gzip/xz/lz4."
            cp "$KERNEL" "$RAW"
          fi

          echo "=== DECOMPRESSED KERNEL ==="
          file "$RAW"
          ls -lh "$RAW"

          echo "=== KERNEL VERSION ==="
          strings "$RAW" | grep -m 10 -E \
            'Linux version|5\.10\.[0-9]+|android[0-9]+-[0-9]+\.[0-9]+' || true

      - name: Extract kernel configuration
        run: |
          git clone --depth=1 \
            --branch android12-5.10-2024-05_r1 \
            https://android.googlesource.com/kernel/common.git \
            kernel

          echo "=== EXTRACT IKCONFIG ==="

          if kernel/scripts/extract-ikconfig \
            unpacked/boot/kernel.raw > phone.config \
            && [ -s phone.config ]; then

            echo "CONFIGURATION FOUND"

            grep -E \
              '^(CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_IKCONFIG|CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_MT7601U|CONFIG_USB)=' \
              phone.config || true
          else
            echo "IKCONFIG NOT FOUND IN PHONE KERNEL"
          fi

      - name: Inspect vendor boot contents
        run: |
          echo "=== VENDOR BOOT FILES ==="
          find unpacked/vendor_boot \
            -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: infinix-kernel-inspection
          path: |
            phone.config
            unpacked/boot/kernel.raw
          if-no-files-found: ignore

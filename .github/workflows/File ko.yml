name: Build panggil ko

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio \
            curl flex git libelf-dev libssl-dev \
            lz4 pahole python3 rsync xz-utils

      - name: Setup 8GB Swap Space
        run: |
          set -e
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          swapon --show

      - name: Clone Kernel and Clang
        run: |
          set -e
          echo "===== CLONE GOOGLE GKI ====="
          git clone --depth=1 \
            --branch android12-5.10-2024-05_r1 \
            https://android.googlesource.com/kernel/common kernel_src
          echo "===== DOWNLOAD AOSP CLANG ====="
          mkdir -p clang-aosp
          curl -L --fail --retry 3 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          tar -xzf clang.tar.gz -C clang-aosp
          rm clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang-aosp/bin" >> "$GITHUB_PATH"

      - name: Inject MT76 Driver from kernel.org v5.10
        run: |
          set -e
          echo "===== DOWNLOAD LINUX 5.10 VANILLA ====="
          curl -L --fail --retry 3 -o linux-5.10.tar.xz https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.tar.xz
          mkdir -p /tmp/vanilla
          tar -xJf linux-5.10.tar.xz -C /tmp/vanilla linux-5.10/drivers/net/wireless/mediatek
          rm linux-5.10.tar.xz
          echo "===== CEK DRIVER VANILLA ====="
          ls /tmp/vanilla/linux-5.10/drivers/net/wireless/mediatek/
          echo "--- ISI MT7601U ---"
          ls /tmp/vanilla/linux-5.10/drivers/net/wireless/mediatek/mt7601u/ || true
          echo "--- ISI MT76 ---"
          ls /tmp/vanilla/linux-5.10/drivers/net/wireless/mediatek/mt76/ | head -n 20 || true
          echo "===== COPY KE GKI ====="
          mkdir -p kernel_src/drivers/net/wireless/mediatek
          cp -r /tmp/vanilla/linux-5.10/drivers/net/wireless/mediatek/mt76 kernel_src/drivers/net/wireless/mediatek/ || true
          cp -r /tmp/vanilla/linux-5.10/drivers/net/wireless/mediatek/mt7601u kernel_src/drivers/net/wireless/mediatek/
          cp /tmp/vanilla/linux-5.10/drivers/net/wireless/mediatek/Kconfig kernel_src/drivers/net/wireless/mediatek/Kconfig
          cp /tmp/vanilla/linux-5.10/drivers/net/wireless/mediatek/Makefile kernel_src/drivers/net/wireless/mediatek/Makefile
          echo "===== HOOK KE PARENT KCONFIG / MAKEFILE ====="
          grep -q "mediatek" kernel_src/drivers/net/wireless/Kconfig || echo 'source "drivers/net/wireless/mediatek/Kconfig"' >> kernel_src/drivers/net/wireless/Kconfig
          grep -q "mediatek" kernel_src/drivers/net/wireless/Makefile || echo 'obj-$(CONFIG_WLAN_VENDOR_MEDIATEK) += mediatek/' >> kernel_src/drivers/net/wireless/Makefile
          echo "===== VERIFIKASI INJECT ====="
          ls kernel_src/drivers/net/wireless/mediatek/mt7601u/ || true
          grep -rn "MT7601U" kernel_src/drivers/net/wireless/mediatek/mt7601u/Kconfig | head || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: gki-5.10.209-aosp-r416183b-${{ github.sha }}
          restore-keys: |
            gki-5.10.209-aosp-r416183b-
          max-size: 4G

      - name: Build Kernel
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_src"
          export ARCH=arm64
          export SUBARCH=arm64
          JOBS=2
          echo "===== BUILD CONFIGURATION ====="
          clang --version
          echo "===== CCACHE BEFORE BUILD ====="
          ccache -z
          ccache -s
          echo "===== GENERATE GKI DEFCONFIG ====="
          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig
          echo "===== DEBUG KCONFIG MT7601U ====="
          grep -A 10 "config MT7601U" drivers/net/wireless/mediatek/mt7601u/Kconfig || true
          echo "===== APPLY CONFIG MINIMAL MT7601U ====="
          ./scripts/config --file out/.config \
            -e WIRELESS -e WLAN -e WLAN_VENDOR_MEDIATEK \
            -m CFG80211 -m MAC80211 -m MT7601U \
            -m MT76 -m MT76_CORE -m MT76_USB -m MT76x02_LIB -m MT76x02_USB -m MT76x0_COMMON -m MT76x0_USB \
            -m RFKILL -m LIB80211 -m LIBARC4 \
            -e MAC80211_RC_MINSTREL -e MAC80211_RC_DEFAULT_MINSTREL \
            -d CFG80211_REQUIRE_SIGNED_REGDB -d CFG80211_CERTIFICATION_ONUS
          echo "===== REFRESH CONFIG ====="
          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig
          echo "===== CEK CONFIG MT7601U ====="
          grep -E "CONFIG_WIRELESS|CONFIG_WLAN|CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_MT76|CONFIG_MT7601U|CONFIG_RFKILL|CONFIG_LIB80211|CONFIG_LIBARC4" out/.config || true
          echo "===== START KERNEL COMPILATION ====="
          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            Image modules
          echo "===== CCACHE AFTER BUILD ====="
          ccache -s
          echo "===== BUILD COMPLETED ====="

      - name: Prepare Artifacts
        run: |
          set -e
          mkdir -p artifacts/modules
          cp kernel_src/out/arch/arm64/boot/Image artifacts/Image
          echo "===== CARI SEMUA KO MT76 ====="
          find kernel_src/out -name '*mt76*.ko' -o -name '*mt7601*.ko' -o -name 'cfg80211.ko' -o -name 'mac80211.ko' || true
          for ko in cfg80211.ko mac80211.ko mt7601u.ko mt76.ko mt76-core.ko mt76-usb.ko mt76x02-lib.ko mt76x02-usb.ko mt76x0-common.ko mt76x0-usb.ko rfkill.ko lib80211.ko libarc4.ko; do
            find kernel_src/out -name "$ko" -exec cp {} artifacts/modules/ \;
          done
          echo "===== ARTIFACT CONTENTS ====="
          ls -lh artifacts/
          ls -lh artifacts/modules/
          echo "===== CEK VERMAGIC ====="
          modinfo artifacts/modules/mt7601u.ko | grep vermagic || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Google-GKI-5.10.209-X6833B-Minimal-MT7601U
          path: artifacts/
          retention-days: 14

name: Build mt7601u for MT6789 Emerald

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev libelf-dev \
            build-essential python3 pahole cpio lz4 zip unzip curl

      - name: Clone Emerald Kernel MT6789
        run: |
          git clone --depth 1 --branch emerald_r-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          ls kernel/arch/arm64/configs/mgk_64_k510_defconfig
          ls kernel/arch/arm64/configs/gki_defconfig

      - name: Clone mt7601u source
        run: |
          git clone --depth 1 https://github.com/ulli-kroll/mt7601u.git mt7601u
          ls mt7601u

      - name: Get Clang 12.0.5
        run: |
          mkdir -p clang
          cd clang
          curl -L -o clang.tar.gz https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/120505/clang-120505.tar.gz
          tar -xf clang.tar.gz
          ls bin/clang
          ./bin/clang --version

      - name: Build mt7601u.ko
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export

name: Build mt7601u for MT6789 Emerald

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev libelf-dev \
            build-essential python3 pahole cpio lz4 zip unzip curl

      - name: Clone Emerald Kernel MT6789
        run: |
          git clone --depth 1 --branch emerald_r-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          ls kernel/drivers/net/wireless/mediatek/mt7601u/
          ls kernel/arch/arm64/configs/mgk_64_k510_defconfig
          ls kernel/arch/arm64/configs/gki_defconfig

      - name: Get Clang r416183b - AOSP
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang
          ls clang/bin/clang
          ./clang/bin/clang --version

      - name: Build mt7601u.ko
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # 1. Base GKI dulu
          make O=out gki_defconfig

          # 2. Merge dengan fragment MT6789
          ./scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/mgk_64_k510_defconfig

          # 3. Paksa nyalain mt7601u yang udah ada di dalam kernel
          echo "CONFIG_MT7601U=m" >> out/.config
          echo "CONFIG_CFG80211=m" >> out/.config
          echo "CONFIG_MAC80211=m" >> out/.config

          make O=out olddefconfig

          echo "=== CHECK CONFIG ==="
          grep -E "CONFIG_CFG80211=|CONFIG_MAC80211=|CONFIG_MT7601U=|CONFIG_LTO_CLANG|CONFIG_CFI_CLANG|CONFIG_LOCALVERSION" out/.config || true

          make O=out -j$(nproc) modules_prepare

          # 4. Build cuma driver mt7601u yang di dalam kernel
          make O=out M=drivers/net/wireless/mediatek/mt7601u \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules -j$(nproc)

          echo "=== RESULT ==="
          ls -lh out/drivers/net/wireless/mediatek/mt7601u/*.ko
          modinfo out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko | grep -E "vermagic|depends|filename" || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-emerald-mt6789
          path: kernel/out/drivers/net/wireless/mediatek/mt7601u/*.ko

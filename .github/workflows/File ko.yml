name: Build mt7601u for MT6789 Emerald

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev libelf-dev \
            build-essential python3 pahole cpio lz4 zip unzip curl

      - name: Clone Emerald Kernel MT6789
        run: |
          git clone --depth 1 --branch emerald_r-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          ls kernel/arch/arm64/configs/mgk_64_k510_defconfig

      - name: Get Clang r416183b - AOSP Android12
        run: |
          mkdir -p clang
          cd clang
          curl -L -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          tar -xf clang.tar.gz
          ./bin/clang --version

      - name: Build mt7601u.ko
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make O=out gki_defconfig

          ./scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/mgk_64_k510_defconfig

          echo "CONFIG_WLAN=y" >> out/.config
          echo "CONFIG_WIRELESS=y" >> out/.config
          echo "CONFIG_WLAN_VENDOR_MEDIATEK=y" >> out/.config
          echo "CONFIG_CFG80211=m" >> out/.config
          echo "CONFIG_MAC80211=m" >> out/.config
          echo "CONFIG_USB=y" >> out/.config
          echo "CONFIG_USB_SUPPORT=y" >> out/.config
          echo "CONFIG_MT7601U=m" >> out/.config

          make O=out olddefconfig

          echo "=== CHECK CONFIG ==="
          grep -E "CONFIG_WLAN_VENDOR_MEDIATEK|CONFIG_MT7601U|CONFIG_CFG80211=|CONFIG_MAC80211=" out/.config || true

          make O=out -j$(nproc) modules_prepare

          make O=out M=drivers/net/wireless/mediatek/mt7601u \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules -j1 V=1

          echo "=== RESULT ==="
          find out -name "mt7601u.ko" | head -n 20
          ls -lh out/drivers/net/wireless/mediatek/mt7601u/ || true

      - name: Collect artifact
        run: |
          mkdir -p artifact
          find kernel/out -name "mt7601u.ko" -exec cp -v {} artifact/ \;
          find kernel/out -name "cfg80211.ko" -exec cp -v {} artifact/ \; || true
          find kernel/out -name "mac80211.ko" -exec cp -v {} artifact/ \; || true
          ls -lh artifact/

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mt7601u-emerald-mt6789
          path: artifact/
          if-no-files-found: error

name: Build MT7601U KO Only-v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mt7601u:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: bash config/dependencies.sh

      - name: Kernel Source
        run: bash config/kernel-source.sh

      - name: AOSP Clang
        run: bash config/clang.sh

      - name: Original Symbols
        run: bash config/symbols.sh

      - name: Kernel Configuration
        run: bash config/kernel-config.sh

      - name: Build MT7601U
        run: bash config/build-driver.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT7601U-KO-5.10.209
          path: artifacts/

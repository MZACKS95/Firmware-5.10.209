
name: Build Google GKI 5.10.209 - X6833B Baseline + MT7601U

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio \
            curl flex git libelf-dev libssl-dev \
            lz4 pahole python3 rsync

      - name: Setup 8GB Swap Space
        run: |
          set -e
          echo "===== SETUP SWAP ====="

          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          echo "===== MEMORY STATUS ====="
          free -h
          swapon --show

      - name: Clone Kernel and Clang
        run: |
          set -e
          echo "===== CLONE GOOGLE GKI ====="

          git clone --depth=1 \
            --branch android12-5.10-2024-05_r1 \
            https://android.googlesource.com/kernel/common kernel_src

          echo "===== DOWNLOAD AOSP CLANG ====="

          mkdir -p clang-aosp

          curl -L --fail --retry 3 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"

          tar -xzf clang.tar.gz -C clang-aosp
          rm clang.tar.gz

          echo "$GITHUB_WORKSPACE/clang-aosp/bin" >> "$GITHUB_PATH"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: gki-5.10.209-mt7601u-${{ github.sha }}
          restore-keys: |
            gki-5.10.209-mt7601u-
          max-size: 4G

      - name: Build Kernel
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_src"

          export ARCH=arm64
          export SUBARCH=arm64

          JOBS=2

          echo "===== BUILD CONFIGURATION ====="
          echo "Architecture: $ARCH"
          echo "Build jobs: $JOBS"
          clang --version

          echo "===== CCACHE BEFORE BUILD ====="
          ccache -z
          ccache -s

          echo "===== GENERATE GKI DEFCONFIG ====="

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          echo "===== ENABLE MT7601U DRIVER ====="

          scripts/config --file out/.config \
            -m CFG80211 \
            -m MAC80211 \
            -m MT7601U \
            -e USB \
            -e FW_LOADER

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== VERIFY MT7601U CONFIGURATION ====="

          grep -E 'CONFIG_(CFG80211|MAC80211|MT7601U|USB|FW_LOADER)=' out/.config

          grep -q '^CONFIG_MT7601U=m$' out/.config || {
            echo "ERROR: CONFIG_MT7601U is not enabled as module"
            exit 1
          }

          echo "===== START KERNEL COMPILATION ====="

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            Image modules

          echo "===== VERIFY MT7601U MODULE ====="

          find out -type f -name 'mt7601u.ko' -print

          test -f out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko || {
            echo "ERROR: mt7601u.ko was not generated at the expected path"
            find out -type f -name 'mt7601u.ko'
            exit 1
          }

          echo "===== CCACHE AFTER BUILD ====="
          ccache -s

          echo "===== BUILD COMPLETED ====="

      - name: Prepare Artifacts
        run: |
          set -e

          mkdir -p artifacts/modules

          cp kernel_src/out/arch/arm64/boot/Image artifacts/Image

          cp \
            kernel_src/out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko \
            artifacts/modules/mt7601u.ko

          cp kernel_src/out/.config artifacts/kernel.config
          cp kernel_src/out/Module.symvers artifacts/Module.symvers

          echo "===== ARTIFACT CONTENTS ====="
          ls -lh artifacts/
          ls -lh artifacts/modules/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Google-GKI-5.10.209-MT7601U
          path: artifacts/
          retention-days: 14

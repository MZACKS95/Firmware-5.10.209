
name: Build Google GKI 5.10.209 - X6833B MT7601U Module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc bison build-essential ccache cpio \
            curl flex git libelf-dev libssl-dev \
            lz4 pahole python3 rsync

      - name: Setup 8GB Swap Space
        run: |
          set -e

          echo "===== SETUP SWAP ====="

          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          echo "===== MEMORY STATUS ====="

          free -h
          swapon --show

      - name: Clone Kernel and Clang
        run: |
          set -e

          echo "===== CLONE GOOGLE GKI ====="

          git clone --depth=1 \
            --branch android12-5.10-2024-05_r1 \
            https://android.googlesource.com/kernel/common kernel_src

          echo "===== DOWNLOAD AOSP CLANG ====="

          mkdir -p clang-aosp

          curl -L --fail --retry 3 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"

          tar -xzf clang.tar.gz -C clang-aosp

          rm clang.tar.gz

          echo "$GITHUB_WORKSPACE/clang-aosp/bin" >> "$GITHUB_PATH"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: gki-5.10.209-mt7601u-${{ github.sha }}
          restore-keys: |
            gki-5.10.209-mt7601u-
          max-size: 4G

      - name: Build Kernel
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_src"

          export ARCH=arm64
          export SUBARCH=arm64

          JOBS=2

          echo "===== BUILD CONFIGURATION ====="

          echo "Architecture: $ARCH"
          echo "Build jobs: $JOBS"

          clang --version

          echo "===== CCACHE BEFORE BUILD ====="

          ccache -z
          ccache -s

          echo "===== CHECK MT7601U SOURCE ====="

          if ! grep -Rqs \
            'config MT7601U' \
            drivers/net/wireless; then

            echo "ERROR: MT7601U Kconfig is not present in this kernel source."

            find drivers/net/wireless -maxdepth 4 -type f \
              \( -name 'Kconfig' -o -name 'Makefile' \) \
              | sort

            exit 1
          fi

          echo "MT7601U source configuration found."

          echo "===== GENERATE GKI DEFCONFIG ====="

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          echo "===== ENABLE MT7601U DRIVER ====="

          scripts/config --file out/.config \
            -e WLAN \
            -e WLAN_VENDOR_MEDIATEK \
            -m CFG80211 \
            -m MAC80211 \
            -m MT7601U \
            -e USB \
            -e FW_LOADER

          echo "===== APPLY KERNEL CONFIGURATION ====="

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== VERIFY MT7601U CONFIGURATION ====="

          grep -E \
            'CONFIG_(WLAN|WLAN_VENDOR_MEDIATEK|CFG80211|MAC80211|MT7601U|USB|FW_LOADER)=' \
            out/.config || true

          grep -q '^CONFIG_MT7601U=m$' out/.config || {
            echo "ERROR: CONFIG_MT7601U is not enabled as module."
            echo "Check MT7601U Kconfig dependencies."
            exit 1
          }

          grep -q '^CONFIG_CFG80211=m$' out/.config || {
            echo "ERROR: CONFIG_CFG80211 is not enabled as module."
            exit 1
          }

          grep -q '^CONFIG_MAC80211=m$' out/.config || {
            echo "ERROR: CONFIG_MAC80211 is not enabled as module."
            exit 1
          }

          echo "===== FINAL CONFIGURATION VERIFIED ====="

          echo "===== START KERNEL COMPILATION ====="

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            Image modules

          echo "===== VERIFY MT7601U MODULE ====="

          MODULE_PATH=$(find out -type f \
            -name 'mt7601u.ko' -print -quit)

          if [ -z "$MODULE_PATH" ]; then
            echo "ERROR: mt7601u.ko was not generated."
            exit 1
          fi

          echo "MT7601U MODULE FOUND:"
          echo "$MODULE_PATH"

          ls -lh "$MODULE_PATH"

          echo "===== CCACHE AFTER BUILD ====="

          ccache -s

          echo "===== BUILD COMPLETED ====="

      - name: Prepare Artifacts
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          mkdir -p artifacts/modules

          echo "===== COPY KERNEL IMAGE ====="

          cp \
            kernel_src/out/arch/arm64/boot/Image \
            artifacts/Image

          echo "===== COPY MT7601U MODULE ====="

          MODULE_PATH=$(find kernel_src/out -type f \
            -name 'mt7601u.ko' -print -quit)

          test -n "$MODULE_PATH"

          cp "$MODULE_PATH" \
            artifacts/modules/mt7601u.ko

          echo "===== COPY BUILD CONFIGURATION ====="

          cp \
            kernel_src/out/.config \
            artifacts/kernel.config

          if [ -f kernel_src/out/Module.symvers ]; then
            cp \
              kernel_src/out/Module.symvers \
              artifacts/Module.symvers
          fi

          echo "===== ARTIFACT CONTENTS ====="

          ls -lh artifacts/
          ls -lh artifacts/modules/

          echo "===== MODULE VERIFICATION ====="

          file artifacts/modules/mt7601u.ko

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Google-GKI-5.10.209-MT7601U
          path: artifacts/
          retention-days: 14

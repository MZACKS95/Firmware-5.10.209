
name: Build Google GKI 5.10.209 - X6833B Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            pahole \
            python3 \
            rsync \
            zstd

      - name: Setup 8GB Swap Space
        run: |
          set -e

          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      - name: Clone Kernel and Clang
        run: |
          set -e

          export KERNEL_COMMIT="7c6bbcca33e1734642601acf07a14140116fa956"

          echo "===== CLONE GOOGLE KERNEL ====="

          git clone \
            --depth=1 \
            --branch android12-5.10-2024-05_r4 \
            https://android.googlesource.com/kernel/common \
            kernel_src

          cd kernel_src

          git checkout "$KERNEL_COMMIT"

          ACTUAL_COMMIT=$(git rev-parse HEAD)

          echo "Kernel commit: $ACTUAL_COMMIT"

          if [ "$ACTUAL_COMMIT" != "$KERNEL_COMMIT" ]; then
            echo "ERROR: Kernel commit mismatch"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          echo "===== DOWNLOAD AOSP CLANG ====="

          mkdir -p clang

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" \
            -o clang.tar.gz

          tar -xf clang.tar.gz -C clang

          rm clang.tar.gz

          chmod +x clang/bin/*

          echo "===== TOOLCHAIN VERSION ====="

          clang/bin/clang --version
          clang/bin/ld.lld --version

      - name: Setup ccache
        run: |
          set -e

          mkdir -p "$HOME/.ccache"

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=4G" >> "$GITHUB_ENV"

          ccache -M 4G
          ccache -z

      - name: Build Kernel
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_src"

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CC="ccache clang"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          JOBS=2

          KERNEL_RELEASE="5.10.209-android12-9-00016-g7c6bbcca33e1-ab12029497"

          echo "===== KERNEL CONFIGURATION ====="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            gki_defconfig

          echo "===== SET LOCALVERSION ====="

          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_LOCALVERSION "-android12-9-00016-g7c6bbcca33e1-ab12029497"

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_LOCALVERSION_AUTO

          echo "===== OLDDEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            olddefconfig

          echo "===== VERIFY KERNEL RELEASE ====="

          ACTUAL_RELEASE=$(make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            kernelrelease)

          echo "Expected: $KERNEL_RELEASE"
          echo "Actual:   $ACTUAL_RELEASE"

          if [ "$ACTUAL_RELEASE" != "$KERNEL_RELEASE" ]; then
            echo "ERROR: Kernel release mismatch"
            exit 1
          fi

          echo "===== BUILD IMAGE AND MODULES ====="

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            Image modules

          echo "===== BUILD COMPLETED ====="

          ccache -s

      - name: Prepare Artifacts
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel_src"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/modules"

          echo "===== VERIFY BUILD OUTPUT ====="

          for file in \
            out/arch/arm64/boot/Image \
            out/Module.symvers \
            out/.config \
            out/System.map \
            out/vmlinux
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: Required file missing or empty: $file"
              exit 1
            fi

            echo "OK: $file"
            ls -lh "$file"
          done

          echo "===== CHECK MODULES.ORDER ====="

          if [ -s out/modules.order ]; then
            echo "FOUND: out/modules.order"
            ls -lh out/modules.order

            cp out/modules.order \
              "$GITHUB_WORKSPACE/artifacts/"
          else
            echo "WARNING: modules.order is missing or empty."
            echo "Continuing without modules.order."
          fi

          echo "===== COPY KERNEL IMAGE ====="

          cp out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/artifacts/Image"

          cp out/Module.symvers \
            "$GITHUB_WORKSPACE/artifacts/Module.symvers"

          cp out/.config \
            "$GITHUB_WORKSPACE/artifacts/kernel.config"

          cp out/System.map \
            "$GITHUB_WORKSPACE/artifacts/System.map"

          cp out/vmlinux \
            "$GITHUB_WORKSPACE/artifacts/vmlinux"

          echo "===== COPY KERNEL MODULES ====="

          find out -type f -name '*.ko' -print

          find out -type f -name '*.ko' \
            -exec cp --parents {} \
            "$GITHUB_WORKSPACE/artifacts/modules/" \;

          echo "===== SAVE KERNEL RELEASE ====="

          make -s O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            kernelrelease \
            > "$GITHUB_WORKSPACE/artifacts/kernelrelease.txt"

          echo "===== ARTIFACT CONTENTS ====="

          find "$GITHUB_WORKSPACE/artifacts" -type f -print

          echo "===== ARTIFACT PREPARATION COMPLETED ====="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6833B-GKI-5.10.209-Baseline
          path: artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
